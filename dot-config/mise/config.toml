[env]
NODE_ENV = "development"

[tools]
bun = "latest"
"cargo:koji" = "latest"
deno = "latest"
go = "latest"
hk = "latest"
java = "temurin-21.0.3"
lua = "5.1.5"
maven = "3.8.1"
node = "lts"
pkl = "latest"
rust = "nightly"
usage = "latest"
zig = "0.13"
zls = "0.13"

[settings]
experimental = true
go_default_packages_file = "~/.go"
idiomatic_version_file_enable_tools = ["ruby"]

[settings.ruby]
ruby_build_opts = "CC=gcc-14 CXX=g++-14"

[tasks.update]
description = 'Update system dependencies'
run = "~/.dotfiles/scripts/commands/update.sh"
alias = 'up'
