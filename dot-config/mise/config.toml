[env]
NODE_ENV = "development"

[tools]
bun = "latest"
"cargo:koji" = "latest"
deno = "latest"
go = "latest"
hk = "latest"
java = "temurin-21.0.3"
lefthook = "latest"
lua = "5.1.5"
maven = "3.8.1"
node = "lts"
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@openai/codex" = "latest"
"npm:@github/copilot" = "latest"
"npm:@charmland/crush" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:opencode-ai" = "latest"
pkl = "latest"
rust = "latest"
usage = "latest"
zig = "0.13"
zls = "0.13"

[settings]
experimental = true
go_default_packages_file = "~/.go"
idiomatic_version_file_enable_tools = ["npm"]

[settings.ruby]

[tasks.update]
description = 'Update system dependencies'
run = "~/.dotfiles/scripts/commands/update.sh"
alias = 'up'
